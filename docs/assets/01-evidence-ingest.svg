<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 478" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14">
  <defs>
    <linearGradient id="accentline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d47ba8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#d47ba8" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <rect width="1100" height="478" rx="14" fill="#0d1117"/>
  <rect x="1.5" y="1.5" width="1097" height="475" rx="13" fill="none" stroke="#30363d" stroke-width="3"/>
  <rect x="0" y="470" width="1100" height="4" fill="url(#accentline)" opacity="0.9"/>

  <circle cx="28" cy="26" r="6" fill="#ff5f57"/>
  <circle cx="50" cy="26" r="6" fill="#febc2e"/>
  <circle cx="72" cy="26" r="6" fill="#28c840"/>

  <g stroke="#d47ba8" fill="none" stroke-width="1.6" stroke-linecap="round">
    <rect x="101" y="15.5" width="20" height="17" rx="6"/>
    <line x1="111" y1="15.5" x2="111" y2="11.5"/>
  </g>
  <circle cx="111" cy="10" r="1.6" fill="#d47ba8"/>
  <circle cx="106.8" cy="22" r="1.7" fill="#d47ba8"/>
  <circle cx="115.2" cy="22" r="1.7" fill="#d47ba8"/>
  <path d="M107 27 Q111 30 115 27" stroke="#d47ba8" stroke-width="1.6" fill="none" stroke-linecap="round"/>

  <text x="550" y="31" text-anchor="middle" font-size="13" fill="#8b949e">one upload, hashed and stored in the same pass — then written down three times</text>

  <rect x="40" y="58" width="1020" height="32" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="58" y="79" font-size="12.5" fill="#c9d1d9">POST /api/v1/cases/{case_id}/evidences · file + title · type · source_origin · collected_at · tags</text>

  <rect x="40" y="110" width="300" height="170" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="58" y="136" font-size="13" font-weight="bold" fill="#d47ba8">1 · PREFLIGHT</text>
  <text x="58" y="164" font-size="12" fill="#c9d1d9">org storage config → provider</text>
  <text x="58" y="186" font-size="12" fill="#8b949e">local · s3 · r2 · wasabi · minio</text>
  <text x="58" y="214" font-size="12" fill="#c9d1d9">size &gt; max_file_bytes → 413</text>
  <text x="58" y="236" font-size="12" fill="#c9d1d9">quota would be exceeded → 413</text>
  <text x="58" y="264" font-size="11" fill="#566070">nothing is stored before this passes</text>

  <path d="M344 195 H364" stroke="#566070" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M358 189 L365 195 L358 201" fill="none" stroke="#566070" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="372" y="110" width="340" height="170" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="390" y="136" font-size="13" font-weight="bold" fill="#d47ba8">2 · ONE PASS, TWO SINKS</text>
  <path d="M400 172 V218" stroke="#566070" stroke-width="2" stroke-linecap="round"/>
  <path d="M400 172 H444" stroke="#566070" stroke-width="2" stroke-linecap="round"/>
  <path d="M438 167 L445 172 L438 177" fill="none" stroke="#566070" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M400 218 H444" stroke="#566070" stroke-width="2" stroke-linecap="round"/>
  <path d="M438 213 L445 218 L438 223" fill="none" stroke="#566070" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="400" cy="195" r="3" fill="#d47ba8"/>

  <rect x="452" y="154" width="248" height="36" rx="8" fill="#0d1117" stroke="#6ea8ff" stroke-opacity="0.4" stroke-width="1.4"/>
  <text x="466" y="177" font-size="12" fill="#6ea8ff">hash_stream → SHA-256</text>

  <rect x="452" y="200" width="248" height="36" rx="8" fill="#0d1117" stroke="#e8b86d" stroke-opacity="0.4" stroke-width="1.4"/>
  <text x="466" y="223" font-size="12" fill="#e8b86d">provider.store → sealed key</text>

  <text x="390" y="260" font-size="11" fill="#566070">tee_stream · 64 KiB chunks · never buffered</text>

  <path d="M716 195 H736" stroke="#566070" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M730 189 L737 195 L730 201" fill="none" stroke="#566070" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="744" y="110" width="316" height="170" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="762" y="136" font-size="13" font-weight="bold" fill="#d47ba8">3 · IDENTITY + GUARDS</text>
  <text x="762" y="164" font-size="12" fill="#c9d1d9">MIME from the first 4096 bytes</text>
  <text x="762" y="186" font-size="12" fill="#c9d1d9">same sha256 in this case → 409</text>
  <text x="762" y="214" font-size="12" fill="#c9d1d9">EV-NNN from an atomic counter</text>
  <text x="762" y="236" font-size="11" fill="#566070">ON CONFLICT DO UPDATE counter + 1</text>
  <text x="762" y="264" font-size="11" fill="#566070">a rejected file is removed from storage</text>

  <path d="M550 284 V294" stroke="#566070" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M544 289 L550 296 L556 289" fill="none" stroke="#566070" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="40" y="300" width="1020" height="112" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <text x="60" y="326" font-size="13" font-weight="bold" fill="#d47ba8">4 · THREE WRITES, ONE TRANSACTION</text>

  <rect x="60" y="338" width="320" height="60" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1.4"/>
  <text x="74" y="362" font-size="12.5" fill="#e6edf3">evidences</text>
  <text x="74" y="382" font-size="11" fill="#566070">the record — number, type, size, hash</text>

  <rect x="396" y="338" width="320" height="60" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1.4"/>
  <text x="410" y="362" font-size="12.5" fill="#e6edf3">evidence_events</text>
  <text x="410" y="382" font-size="11" fill="#566070">custody — ingested · actor · ip · time</text>

  <rect x="732" y="338" width="308" height="60" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1.4"/>
  <text x="746" y="362" font-size="12.5" fill="#e6edf3">audit_log</text>
  <text x="746" y="382" font-size="11" fill="#566070">case action — evidence_added + HMAC</text>

  <text x="550" y="444" text-anchor="middle" font-size="13" fill="#8b949e">the hash exists before the row does — and no endpoint rewrites a stored object</text>
</svg>
