  <text x="58" y="372" font-size="12" fill="#c9d1d9">only an admin may reopen an archived case</text>
  <text x="58" y="394" font-size="11" fill="#566070">admin override → fechado · em_revisao · em_investigacao · aberto</text>

  <rect x="560" y="320" width="500" height="96" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
