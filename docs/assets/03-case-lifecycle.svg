  <text x="578" y="372" font-size="12" fill="#c9d1d9">fechado sets closed_at · arquivado sets archived_at</text>
  <text x="578" y="394" font-size="11" fill="#566070">fechado → em_investigacao clears closed_at</text>

  <text x="550" y="444" text-anchor="middle" font-size="13" fill="#8b949e">a pure module with no I/O — and 21 tests standing behind the graph</text>
